# Deep Research harness configuration — see PRD.md §13.
#
# This is the tool's *bundled* default config, used only when no `config.yaml` exists in your
# project folder (the directory you run `deep-research` from). Run `deep-research init` in your
# project folder to copy this file there so you can customize it — see README.md.

# Any Pydantic AI model string, "<provider>:<model-name>" — nothing here is provider-specific,
# and the three roles don't have to share a provider. Set the API key for whichever provider you
# name (ANTHROPIC_API_KEY, OPENAI_API_KEY, ...); the tool checks it can resolve every model
# before it starts work, so a missing key fails immediately rather than mid-run.
#
# To run against a different provider without editing this file:
#   DEEP_RESEARCH_MODEL=openai:gpt-5-mini deep-research run "..."
# or per role: DEEP_RESEARCH_MODEL_LEAD / _RESEARCHER / _CRITIC.
model:
  #lead: "anthropic:claude-fable-5"       # scoping, gap-check, and synthesis agent                   -- Needs strong models, does the synthesis of all researchers
  #researcher: "anthropic:claude-fable-5" # per-sub-question worker agent (Researcher() capability)   -- Needs strongest model
  #critic: "anthropic:claude-fable-5"     # reviews the draft report; a smaller/cheaper model is fine -- May use weaker model
  lead: "openrouter:google/gemini-3.7-flash"
  researcher: "openrouter:openai/gpt-5.6-luna"
  critic: "openrouter:deepseek/deepseek-v4-flash-0731"


# Fallback prices, used ONLY where Pydantic AI's pricing data (the genai-prices package) has no
# entry for a model — which is common for models released recently, and for provider-prefixed
# names such as OpenRouter's even when the underlying model is priced under its native provider.
#
# Without a price, `budgets.spend_limit_usd` cannot be enforced and the run warns
# (CostNotFoundWarning); only the token and request ceilings hold. Add the model's published
# rates here and the USD ceilings work again, with the figure reported as an estimate.
#
# Keys must match the model strings in `model:` exactly. A measured price always wins, so an
# entry for a model genai-prices does know is simply ignored.
